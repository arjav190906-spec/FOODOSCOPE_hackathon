<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swap: flavor-matched substitutes</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:30px auto;padding:0 16px;color:#17302a;background:#f4f8f4}
  h1{margin-bottom:4px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}
  select{padding:8px;font-size:1rem}
  .card{background:#fff;border:1px solid #cfdad3;border-radius:12px;padding:14px;margin:10px 0}
  .card.top{border:2px solid #1f6b4f}
  .card.live{border-left:4px solid #1f6b4f}
  .score{font-size:1.8rem;font-weight:800;color:#1f6b4f}
  .chip{display:inline-block;background:#e3ece6;border-radius:99px;padding:2px 10px;margin:2px;font-size:.85rem}
  .lost{color:#a8321f;margin-top:6px}
  .muted{font-size:.85rem;color:#586b64}
  #status{margin:8px 0}
</style>
</head>
<body>
<h1>Swap</h1>
<p>Missing an ingredient, or can’t use it? Find the closest flavor match and see why it works.</p>

<div class="row">
  <select id="dish" aria-label="Dish"></select>
  <select id="miss" aria-label="Ingredient you can't use"></select>
  <label><input type="checkbox" id="nut"> Nut-free</label>
  <label><input type="checkbox" id="dairy"> Dairy-free</label>
  <label><input type="checkbox" id="soy"> Soy-free</label>
</div>

<div id="recipe"></div>
<div id="status" class="muted"></div>
<div id="res"></div>

<script src="app.js"></script>
</body>
</html>
